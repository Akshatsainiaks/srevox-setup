apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "srevox.fullname" . }}-config
  labels:
    {{- include "srevox.labels" . | nindent 4 }}
data:
  POSTGRES_HOST: "{{ include "srevox.fullname" . }}-postgres"
  POSTGRES_PORT: {{ .Values.postgres.port | quote }}
  POSTGRES_DB: {{ .Values.postgres.database | quote }}
  POSTGRES_USER: {{ .Values.postgres.username | quote }}
  REDIS_URL: "redis://{{ include "srevox.fullname" . }}-redis:{{ .Values.redis.port }}"
  FRONTEND_URL: {{ .Values.global.frontendUrl | quote }}
  API_URL: "http://{{ include "srevox.fullname" . }}-api:4000"
  ACTIVITY_SERVICE_URL: "http://{{ include "srevox.fullname" . }}-activity:5005"
